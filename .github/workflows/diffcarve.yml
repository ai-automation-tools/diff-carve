name: DiffCarve

# DiffCarve on its own PRs, from this checkout (./), not a published tag.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write # TEMP: proving Slice 4 on PR #24
  pull-requests: write

jobs:
  carve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base has to be in the clone
      - uses: ./
        with:
          threshold: 200 # this repo holds itself to the sub-200-line layers it proposes
          dry-run: false # TEMP: proving Slice 4 on PR #24
