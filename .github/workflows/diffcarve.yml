name: DiffCarve

# DiffCarve on its own PRs, from this checkout (./), not a published tag.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  carve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base has to be in the clone
      - uses: ./
