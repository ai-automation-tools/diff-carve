name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # engines asks for 22.18+; type stripping is on by default there
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
